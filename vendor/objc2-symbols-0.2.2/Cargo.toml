[dependencies.objc2]
default-features = false
version = "0.5.2"

[dependencies.objc2-foundation]
default-features = false
version = "0.2.2"

[features]
NSSymbolEffect = ["objc2-foundation/NSObject"]
all = ["NSSymbolEffect"]
alloc = ["objc2/alloc", "objc2-foundation/alloc"]
default = ["std"]
std = ["alloc", "objc2/std", "objc2-foundation/std"]

[lib]
path = "src/lib.rs"

[lints.clippy]
cargo = "warn"
ptr_as_ptr = "warn"

[lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["api-bindings", "development-tools::ffi", "external-ffi-bindings", "os::macos-apis"]
description = "Bindings to the Symbols framework"
edition = "2021"
keywords = ["cocoa", "apple", "framework", "macos", "ios"]
license = "MIT"
name = "objc2-symbols"
readme = "README.md"
repository = "https://github.com/madsmtm/objc2"
rust-version = "1.60"
version = "0.2.2"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
features = ["all"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-tvos", "aarch64-apple-watchos", "aarch64-apple-ios-macabi"]
