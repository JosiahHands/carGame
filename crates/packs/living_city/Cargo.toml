[package]
name = "living_city"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The local AI (llama.cpp). Without it the city uses only its built-in brain.
default = ["local-ai"]
local-ai = ["dep:llama-cpp-2"]

[dependencies]
bevy.workspace = true
import.workspace = true
game.workspace = true
bevy_egui.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
regex = "1.12.2"
# The local AI: llama.cpp, running an open-source model on this computer.
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["common"], optional = true }

# On Macs the AI runs on the graphics chip (Metal).
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["common", "metal"], optional = true }
