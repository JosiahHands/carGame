# Car Game 1.3.0: the game rebuilt in Rust on the Bevy engine.
#
# crates/car_game              the app: starts Bevy with the game and its packs
# crates/game                  the game itself: driving, garage, worlds, events, career
# crates/import                brings progress over from the old (1.2.x) app
# crates/packs/real_physics    Real Physics pack
# crates/packs/photo_real      Photo Real pack
# crates/packs/living_city     Living City pack
#
# Every library is stored in vendor/, so a build never downloads anything
# (see .cargo/config.toml).
[workspace]
resolver = "3"
members = [
  "crates/car_game",
  "crates/game",
  "crates/import",
  "crates/packs/real_physics",
  "crates/packs/photo_real",
  "crates/packs/living_city",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
# Only the 3D, UI and audio parts of Bevy (no 2D sprites).
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "ui", "audio"] }
game = { path = "crates/game" }
import = { path = "crates/import" }
real_physics = { path = "crates/packs/real_physics" }
photo_real = { path = "crates/packs/photo_real" }
living_city = { path = "crates/packs/living_city" }

# Fast enough to play while developing: our code lightly optimized, the
# libraries fully optimized (they rarely change, so they build once).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The downloads: as fast and as small as practical.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
