[build-dependencies.cc]
features = ["parallel"]
version = "1.0.42"

[dependencies.android-properties]
version = "0.2"

[dependencies.bitflags]
version = "2.0"

[dependencies.jni]
version = "0.22.4"

[dependencies.libc]
version = "0.2.139"

[dependencies.log]
version = "0.4"

[dependencies.ndk]
default-features = false
version = "0.9.0"

[dependencies.ndk-context]
version = "0.1.1"

[dependencies.ndk-sys]
version = "0.6.0"

[dependencies.num_enum]
version = "0.7"

[dependencies.simd_cesu8]
optional = true
version = "1.0.1"

[dependencies.thiserror]
version = "2"

[dev-dependencies.jni]
version = "0.22.4"

[features]
api-level-30 = ["ndk/api-level-30"]
default = []
game-activity = ["simd_cesu8"]
native-activity = []

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "Glue for building Rust applications on Android with NativeActivity or GameActivity"
documentation = "https://docs.rs/android-activity"
edition = "2021"
homepage = "https://github.com/rust-mobile/android-activity"
include = ["/build.rs", "/android-games-sdk", "/LICENSE*", "/src"]
keywords = ["android", "ndk"]
license = "MIT OR Apache-2.0"
name = "android-activity"
readme = "README.md"
repository = "https://github.com/rust-mobile/android-activity"
rust-version = "1.85.0"
version = "0.6.1"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["aarch64-linux-android", "armv7-linux-androideabi", "i686-linux-android", "x86_64-linux-android"]
