[dependencies.async-task]
default-features = false
version = "4.7.1"

[dependencies.cfg-if]
version = "1.0.4"

[dependencies.js-sys]
default-features = false
version = "0.3.77"

[dependencies.wasm-bindgen]
default-features = false
version = "0.2.100"

[dev-dependencies.futures-channel]
version = "0.3"

[dev-dependencies.wasm-bindgen-futures]
version = "0.4.46"

[dev-dependencies.wasm-bindgen-test]
version = "0.3"

[dev-dependencies.wasm_thread]
version = "0.3.3"

[features]
default = ["std"]
std = ["wasm-bindgen/std", "js-sys/std", "async-task/std"]

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "The simplest way to run async tasks on the web"
edition = "2024"
include = ["/LICENSE-*", "/src"]
license = "MIT OR Apache-2.0"
name = "web-task"
readme = "README.md"
repository = "https://github.com/NthTensor/web-task"
version = "1.1.3"
