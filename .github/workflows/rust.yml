# Checks the Rust game builds and passes its tests on macOS, Windows
# and Linux, for every pull request and every push to main. (A branch with
# a pull request is checked once, as the pull request.) Everything builds
# offline from the stored libraries (libs/ and packs/*/libs/).
name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest, name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for sound, controllers and windows
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libclang-dev cmake
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      # rustup reads rust-toolchain.toml and installs that exact Rust.
      - run: rustup show active-toolchain || rustup toolchain install
      # Cargo judges libraries stored by path (packs/*/libs) by their files'
      # times, and a checkout makes every file new: without this the cache
      # is thrown away and everything is compiled again.
      - name: Fix the stored libraries' file times
        shell: bash
        run: find packs/living_city/libs -type f -exec touch -t 200001010000 {} +
      - name: Identify vendored dependencies
        id: vendor
        shell: bash
        run: echo "tree=$(git ls-tree HEAD libs packs/living_city/libs | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # Keep compiled dependencies and fingerprints. The game and test binaries relink from source.
      - uses: actions/cache@v5
        with:
          path: |
            builds/ci/.fingerprint
            builds/ci/build
            builds/ci/deps/*
            !builds/ci/deps/car_game-*
            !builds/ci/deps/game-*
            !builds/ci/deps/living_city-*
            !builds/ci/deps/photo_real-*
            !builds/ci/deps/real_physics-*
          key: cargo-ci-${{ matrix.os }}-${{ runner.arch }}-${{ steps.vendor.outputs.tree }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-ci-${{ matrix.os }}-${{ runner.arch }}-${{ steps.vendor.outputs.tree }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --profile ci --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests
        run: cargo test --profile ci --workspace --locked --offline
      - name: Build the game
        run: cargo build --profile ci --workspace --locked --offline
