# Checks the Rust game (1.3.0) builds and passes its tests on macOS, Windows
# and Linux, for every pull request and every push to main or a features/
# or fix/ branch. Everything builds offline from vendor/.
name: Rust

on:
  pull_request:
  push:
    branches: [main, 'features/**', 'fix/**']

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest, name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for sound, controllers and windows
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libclang-dev cmake
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      # rustup reads rust-toolchain.toml and installs that exact Rust.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --offline
      - name: Build the game
        run: cargo build --workspace --locked --offline
