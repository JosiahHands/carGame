name: Final safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: final-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Final safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting and the offline lockfile
        run: |
          cargo fmt --all --check
          cargo metadata --format-version 1 --locked --offline > /dev/null
      - name: Check Bash and Python syntax
        run: |
          for script in tools/*.sh tools/packaging/*.sh; do bash -n "$script"; done
          python3 -m py_compile tools/test.py tools/packaging/smoke.py
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/install.ps1').Path, [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors) { throw ($errors -join "`n") }

  windows-installer:
    # Compiles and installs the real installer script around a stand-in game,
    # so an installer error shows up here instead of after the release merge.
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Package a stand-in game
        run: |
          mkdir -p builds
          printf 'Car Game stand-in\n' > builds/car-game.exe
          version=$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          bash tools/packaging/package.sh windows "$version" builds/car-game.exe upload
      - name: Install it as an update
        shell: pwsh
        run: ./tools/packaging/verify-windows.ps1
