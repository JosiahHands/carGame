name: Final safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: final-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Final safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting and the offline lockfile
        run: |
          cargo fmt --all --check
          cargo metadata --format-version 1 --locked --offline > /dev/null
      - name: Check Bash and Python syntax
        run: |
          for script in tools/*.sh tools/packaging/*.sh; do bash -n "$script"; done
          python3 -m py_compile tools/test.py tools/packaging/smoke.py
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/install.ps1').Path, [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors) { throw ($errors -join "`n") }
