# Checks every pull request (and every push to main) still type-checks and
# builds, without packs and with all of them.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # And with every pack in it.
      - run: npm run build
        env:
          CAR_GAME_PACKS: all
