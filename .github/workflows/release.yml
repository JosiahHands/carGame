name: Native release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the Cargo version
        id: release
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$version"
          requested=$(printf '%s\n' "$MESSAGE" | grep -oE '(^|[^0-9A-Za-z.])v[0-9]+\.[0-9]+\.[0-9]+([^0-9A-Za-z.]|$)' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [[ -z "$requested" ]] || git rev-parse -q --verify "refs/tags/$requested" >/dev/null; then exit 0; fi
          if [[ "$requested" != "v$version" ]]; then
            echo "Commit release version $requested differs from Cargo version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac-arm, out: builds/release, binary: car-game }
          # Built on the Apple Silicon runners, which are far faster than the Intel ones.
          - { os: macos-15, platform: mac-intel, target: x86_64-apple-darwin, out: builds/x86_64-apple-darwin/release, binary: car-game }
          - { os: windows-2025, platform: windows, out: builds/release, binary: car-game.exe }
          - { os: ubuntu-22.04, platform: linux, out: builds/release, binary: car-game }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libclang-dev cmake zip squashfs-tools
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Add the cross-compilation target
        if: matrix.target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      # A fresh checkout gives every file the current time, and Cargo rebuilds
      # any library whose build script watches a file newer than its last
      # build (proc-macro2, quote, serde and everything that uses them).
      # Old fixed times keep the cached libraries up to date.
      - name: Fix the stored libraries' file times
        run: find libs packs/*/libs -type f -exec touch -t 200001010000 {} +
      - name: Identify vendored dependencies
        id: vendor
        run: echo "tree=$(git ls-tree HEAD libs packs/living_city/libs | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # Keep the compiled vendored dependencies and their Cargo fingerprints
      # (a cross-compiled build keeps its own under builds/<target>/release).
      - uses: actions/cache@v5
        with:
          path: |
            builds/release/.fingerprint
            builds/release/build
            builds/release/deps
            builds/*/release/.fingerprint
            builds/*/release/build
            builds/*/release/deps
          key: cargo-release-${{ matrix.platform }}-${{ runner.arch }}-${{ steps.vendor.outputs.tree }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-release-${{ matrix.platform }}-${{ runner.arch }}-${{ steps.vendor.outputs.tree }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Build the game
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --package car_game --locked --offline ${TARGET:+--target "$TARGET"}
      - name: Check the Intel Mac build
        if: matrix.platform == 'mac-intel'
        run: test "$(lipo -archs builds/x86_64-apple-darwin/release/car-game)" = x86_64
      - name: Create archives and installers
        env:
          GAME_VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.out }}/${{ matrix.binary }}
        run: bash tools/packaging/package.sh "$PLATFORM" "$GAME_VERSION" "$BINARY" upload
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error
          overwrite: true
          # The archives and installers are already compressed.
          compression-level: 0
      - name: Verify Windows installer contents and shortcut upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/packaging/verify-windows.ps1

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GAME_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: upload
          merge-multiple: true
      - name: Publish all six downloads
        run: |
          for file in Car-Game-macOS-Apple-Silicon.zip Car-Game-macOS-Intel.zip \
            Car-Game-Windows-Setup.exe Car-Game-Windows.zip Car-Game-Linux.AppImage Car-Game-Linux.zip; do
            test -s "upload/$file"
          done
          gh release create "v$GAME_VERSION" upload/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Car Game v$GAME_VERSION" --generate-notes
