name: Native release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the Cargo version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version=$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$version"
          if [[ "$EVENT_NAME" == push ]]; then
            requested=$(printf '%s\n' "$MESSAGE" | grep -oE '(^|[^0-9A-Za-z.])v[0-9]+\.[0-9]+\.[0-9]+([^0-9A-Za-z.]|$)' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
            if [[ -z "$requested" ]] || git rev-parse -q --verify "refs/tags/$requested" >/dev/null; then exit 0; fi
            if [[ "$requested" != "v$version" ]]; then
              echo "Commit release version $requested differs from Cargo version v$version" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_REF" != "features/v$version" ]]; then
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac-arm, binary: car-game }
          - { os: macos-15-intel, platform: mac-intel, binary: car-game }
          - { os: windows-2025, platform: windows, binary: car-game.exe }
          - { os: ubuntu-22.04, platform: linux, binary: car-game }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libclang-dev cmake zip squashfs-tools
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builds"
          key: release-${{ matrix.platform }}
      - name: Build the game
        run: cargo build --release --package car_game --locked --offline
      - name: Create archives and installers
        env:
          GAME_VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: bash tools/packaging/package.sh "$PLATFORM" "$GAME_VERSION" "builds/release/$BINARY" upload
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error
      - name: Test the Windows installer and run the installed game
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
          WGPU_FORCE_FALLBACK_ADAPTER: '1'
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'car-game-test'
          $installer = Start-Process -Wait -PassThru -FilePath 'upload/Car-Game-Windows-Setup.exe' -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`""
          )
          if ($installer.ExitCode -ne 0) { throw "Installer returned $($installer.ExitCode)" }
          Expand-Archive 'upload/Car-Game-Windows.zip' -DestinationPath (Join-Path $env:RUNNER_TEMP 'car-game-portable')
          $exe = Join-Path $install 'car-game.exe'
          $portable = Join-Path $env:RUNNER_TEMP 'car-game-portable/Car Game/car-game.exe'
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash $portable).Hash) { throw 'Installed and portable executables differ' }
          if (!(Test-Path "$install/assets/packs/photo_real/libs/car-models/cars.glb")) { throw 'Installer omitted Photo Real assets' }
          python tools/packaging/smoke.py $exe qa --timeout 480
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: qa-${{ matrix.platform }}
          path: |
            qa/*/frame.png
            qa/*/game.log
          if-no-files-found: ignore

  smoke-linux:
    # The AppImage is built on Ubuntu 22.04, so it runs on that and newer
    # systems, and is played here on Ubuntu 24.04: 22.04's software renderer
    # (Mesa 23.2 llvmpipe) stops drawing after the first few dozen frames,
    # which newer Mesa doesn't.
    name: Play the Linux AppImage
    needs: build
    # Even if another platform's package failed, as long as there was a build.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-linux
          path: upload
      - name: Software graphics and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers
      - name: Smoke-test the Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WGPU_BACKEND: vulkan
          WGPU_FORCE_FALLBACK_ADAPTER: '1'
        run: |
          chmod +x upload/Car-Game-Linux.AppImage
          xvfb-run -a python3 tools/packaging/smoke.py upload/Car-Game-Linux.AppImage qa --timeout 480
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-linux
          path: |
            qa/*/frame.png
            qa/*/game.log
          if-no-files-found: ignore

  release:
    name: Publish the release
    needs: [version, build, smoke-linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GAME_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: upload
          merge-multiple: true
      - name: Publish all six downloads
        run: |
          for file in Car-Game-macOS-Apple-Silicon.zip Car-Game-macOS-Intel.zip \
            Car-Game-Windows-Setup.exe Car-Game-Windows.zip Car-Game-Linux.AppImage Car-Game-Linux.zip; do
            test -s "upload/$file"
          done
          gh release create "v$GAME_VERSION" upload/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Car Game v$GAME_VERSION" --generate-notes
