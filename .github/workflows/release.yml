name: Native release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the Cargo version
        id: release
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$version"
          requested=$(printf '%s\n' "$MESSAGE" | grep -oE '(^|[^0-9A-Za-z.])v[0-9]+\.[0-9]+\.[0-9]+([^0-9A-Za-z.]|$)' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [[ -z "$requested" ]] || git rev-parse -q --verify "refs/tags/$requested" >/dev/null; then exit 0; fi
          if [[ "$requested" != "v$version" ]]; then
            echo "Commit release version $requested differs from Cargo version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac-arm, binary: car-game }
          - { os: macos-15-intel, platform: mac-intel, binary: car-game }
          - { os: windows-2025, platform: windows, binary: car-game.exe }
          - { os: ubuntu-22.04, platform: linux, binary: car-game }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libclang-dev cmake zip squashfs-tools
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - run: rustup show active-toolchain || rustup toolchain install
      # Preserve Cargo's cached path-dependency builds across fresh checkouts.
      - name: Fix the stored libraries' file times
        run: find packs/living_city/libs -type f -exec touch -t 200001010000 {} +
      - name: Identify vendored dependencies
        id: vendor
        run: echo "tree=$(git ls-tree HEAD libs packs/living_city/libs | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # Keep the compiled vendored dependencies and their Cargo fingerprints.
      - uses: actions/cache@v5
        with:
          path: |
            builds/release/.fingerprint
            builds/release/build
            builds/release/deps
          key: cargo-release-${{ matrix.os }}-${{ runner.arch }}-${{ steps.vendor.outputs.tree }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-release-${{ matrix.os }}-${{ runner.arch }}-${{ steps.vendor.outputs.tree }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Build the game
        run: cargo build --release --package car_game --locked --offline
      - name: Create archives and installers
        env:
          GAME_VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: bash tools/packaging/package.sh "$PLATFORM" "$GAME_VERSION" "builds/release/$BINARY" upload
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error
          overwrite: true
          # The archives and installers are already compressed.
          compression-level: 0
      - name: Verify Windows installer contents and shortcut upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Car Game update test'
          # An update over older versions: 1.2.x's shortcuts (Start menu and
          # Desktop) and 1.3.0/1.3.1's Start menu folder must be replaced, not duplicated.
          $shell = New-Object -ComObject WScript.Shell
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('Desktop')
          New-Item -ItemType Directory -Force (Join-Path $programs 'Car Game') | Out-Null
          foreach ($old in @((Join-Path $programs 'Car Game.lnk'), (Join-Path $desktop 'Car Game.lnk'), (Join-Path $programs 'Car Game\Car Game.lnk'))) {
            $link = $shell.CreateShortcut($old)
            $link.TargetPath = "$env:WINDIR\notepad.exe"
            $link.Save()
          }
          # Match the extended drive path passed by the v1.4.0 in-game updater.
          $installer = Start-Process -Wait -PassThru -FilePath 'upload/Car-Game-Windows-Setup.exe' -ArgumentList @(
            '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "`"/DIR=\\?\$install`""
          )
          if ($installer.ExitCode -ne 0) { throw "Installer returned $($installer.ExitCode)" }
          Expand-Archive 'upload/Car-Game-Windows.zip' -DestinationPath (Join-Path $env:RUNNER_TEMP 'car-game-portable')
          $exe = Join-Path $install 'car-game.exe'
          $portable = Join-Path $env:RUNNER_TEMP 'car-game-portable/Car Game/car-game.exe'
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash $portable).Hash) { throw 'Installed and portable executables differ' }
          if (!(Test-Path "$install/assets/packs/photo_real/libs/car-models/cars.glb")) { throw 'Installer omitted Photo Real assets' }
          if (Test-Path (Join-Path $programs 'Car Game')) { throw 'The 1.3.0/1.3.1 Start menu folder is still there' }
          foreach ($path in @((Join-Path $programs 'Car Game.lnk'), (Join-Path $desktop 'Car Game.lnk'))) {
            $link = $shell.CreateShortcut($path)
            if ($link.TargetPath -ne (Resolve-Path $exe).Path) { throw "$path points at $($link.TargetPath)" }
            if ($link.IconLocation -notlike '*icon.ico*') { throw "$path has no icon ($($link.IconLocation))" }
          }
          $found = @(Get-ChildItem $programs -Recurse -Filter 'Car Game*.lnk')
          if ($found.Count -ne 1) { throw "Expected one Start menu shortcut, found: $($found.FullName -join ', ')" }

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GAME_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: upload
          merge-multiple: true
      - name: Publish all six downloads
        run: |
          for file in Car-Game-macOS-Apple-Silicon.zip Car-Game-macOS-Intel.zip \
            Car-Game-Windows-Setup.exe Car-Game-Windows.zip Car-Game-Linux.AppImage Car-Game-Linux.zip; do
            test -s "upload/$file"
          done
          gh release create "v$GAME_VERSION" upload/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Car Game v$GAME_VERSION" --generate-notes
